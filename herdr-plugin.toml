id = "asermax.priority-view"
name = "Priority View"
version = "0.5.0"
min_herdr_version = "0.9.0"
description = "Agent panel ordered by how much attention an agent needs, then per-agent priority, then how long it has been waiting."
platforms = ["linux", "macos"]

[[startup]]
command = ["bun", "bin/apply.ts"]

[[actions]]
id = "high"
title = "Priority: high"
contexts = ["pane"]
command = ["bun", "bin/set.ts", "high"]

[[actions]]
id = "normal"
title = "Priority: normal"
contexts = ["pane"]
command = ["bun", "bin/set.ts", "normal"]

[[actions]]
id = "low"
title = "Priority: low"
contexts = ["pane"]
command = ["bun", "bin/set.ts", "low"]

[[events]]
on = "pane.agent_detected"
command = ["bun", "bin/on-agent-event.ts"]

[[events]]
on = "pane.agent_status_changed"
command = ["bun", "bin/on-agent-event.ts"]
